[package]
name = "nitely-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
rusqlite.workspace = true
dirs.workspace = true
ureq = { version = "3", features = ["json", "platform-verifier"] }
base64 = "0.22"
toml = "1"
serde_ignored = "0.1"
regex = "1"
quick-xml = "0.42"
toml_edit = "0.23"
sha2 = "0.10"
ed25519-dalek = "2"
# The approval key (approval.rs, docs/approvals.md).
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
getrandom = "0.3"
if-addrs = "0.13"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tree-sitter = "=0.27.1"
tree-sitter-rust = "=0.24.2"
tree-sitter-typescript = "=0.23.2"
tree-sitter-javascript = "=0.25.0"
# The phone server over HTTPS (phone.rs, docs/phone.md); the same rustls and ring ureq uses.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging", "tls12"] }
rustls-pki-types = { version = "1", features = ["std"] }
# Git reads in process (git_read.rs, NIT-518): no network, no worktree status.
gix = { version = "0.89", default-features = false, features = ["sha1", "revision"] }
# Web push to paired phones (push.rs): VAPID signing, RFC 8291 encryption.
ring = "0.17"

[features]
# test_repo, for nitely-crew's tests (NIT-497).
test-support = []

[dev-dependencies]
rcgen = "0.13"
