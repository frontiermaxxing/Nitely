[package]
name = "nitely-crew"
version.workspace = true
edition.workspace = true
license.workspace = true

# The crew and the reports built on the core (src/lib.rs). Nothing in nitely-core depends on it.
[dependencies]
nitely-core.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
rusqlite.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
ureq = { version = "3", features = ["json", "platform-verifier"] }
base64 = "0.22"
toml = "1"
regex = "1"
toml_edit = "0.23"
sha2 = "0.10"
ed25519-dalek = "2"

[dev-dependencies]
nitely-core = { workspace = true, features = ["test-support"] }
