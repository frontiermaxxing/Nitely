# Every commit in a pull request from a fork must be signed off by its author (Developer
# Certificate of Origin, CONTRIBUTING.md). Branches pushed to this repo by its own agents are not
# checked. scripts/dco.mjs does the check; its test runs with npm test.
#
# pull_request_target runs this workflow and the checker as they are on main, never as the fork
# has them, so a pull request cannot change what checks it. The pull request's commits are only
# fetched and read by git; nothing from them runs.

name: DCO

on:
  pull_request_target:
    branches: [main]

permissions:
  contents: read

jobs:
  sign-off:
    name: Signed off
    if: github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch the pull request's commits
        env:
          PR: ${{ github.event.pull_request.number }}
        run: git fetch --no-tags "https://github.com/${GITHUB_REPOSITORY}.git" "+refs/pull/${PR}/head:refs/remotes/pr/head"

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Check sign-offs
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: node scripts/dco.mjs "$BASE" "$HEAD"
