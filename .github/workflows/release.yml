# Builds and publishes Nitely's releases (docs/releasing.md):
#   nightly  every day at 05:00 UTC when main changed since the last nightly (or on demand): the
#            rolling pre-release "nightly", replaced each time
#   beta     a pushed tag v1.2.3-beta.N: a pre-release
#   stable   a pushed tag v1.2.3, or promote.yml turning a beta into one: a full release
#   test     a pushed tag v1.2.3-test.N: a draft only collaborators see, to try this workflow
# Each build runs the gate, stamps the version (scripts/release-meta.mjs decides it), builds the
# nitely CLI and the NSIS installer that carries it, installs that installer on the runner to check
# it, writes the notes with `nitely release-notes`, and publishes with SHA256SUMS.txt. A tag's build
# also gets a GitHub build-provenance attestation for each file (keyless, through Sigstore), which
# anyone can check with `gh attestation verify`. With the updater signing key set (the
# TAURI_SIGNING_PRIVATE_KEY secret), it also signs the installer for the updater and updates the
# channel's manifest under the "updates" release.

name: Release

on:
  push:
    tags: ["v*"]
  schedule:
    - cron: "0 5 * * *"
  # promote.yml dispatches a stable tag's build this way, on the tag itself (so it is attested).
  workflow_dispatch:
    inputs:
      ref:
        description: "nightly, or a tag to build again (choose the same tag under \"Use workflow from\")"
        default: nightly

# One build per tag (or for the nightly) at a time. Builds for different tags run side by side:
# GitHub keeps only one pending run per group, so a shared group could drop a queued tag. Their
# manifests stay right regardless: each only ever moves a channel forward.
concurrency:
  group: release-${{ inputs.ref || (github.event_name == 'schedule' && 'nightly') || github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 90
    # id-token and attestations: the provenance attestations (keyless: GitHub's OIDC token, signed
    # through Sigstore).
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
      GH_TOKEN: ${{ github.token }}
      REF: ${{ inputs.ref || (github.event_name == 'schedule' && 'nightly') || github.ref_name }}
    defaults:
      run:
        shell: bash
    steps:
      # The runner's TEMP is an 8.3 short path; see ci.yml.
      - name: Long temp path
        run: |
          echo "TEMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "TMP=$RUNNER_TEMP" >> "$GITHUB_ENV"

      - uses: actions/checkout@v5
        with:
          # A tag given as input (a rebuild, or promote.yml) is checked out by name, a pushed tag as
          # pushed, and a nightly always from main, whichever branch dispatched it.
          ref: ${{ (inputs.ref && inputs.ref != 'nightly' && format('refs/tags/{0}', inputs.ref)) || (github.event_name == 'push' && github.ref) || 'refs/heads/main' }}
          fetch-depth: 0

      # Skipped only when the nightly of this very commit is fully out: its release exists, and
      # with the updater key set, nightly.json names it. A run that failed halfway builds again.
      - name: Skip a nightly when main has not changed
        id: changed
        env:
          SIGNING_SECRET: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
        run: |
          build=true
          head=$(git rev-parse HEAD)
          # Signed only with both halves of the key (see "Build the installer").
          pubkey=$(node -e "console.log(require('./src-tauri/tauri.conf.json').plugins?.updater?.pubkey ?? '')" 2>/dev/null || true)
          SIGNING=false
          [ "$SIGNING_SECRET" = true ] && [ -n "$pubkey" ] && SIGNING=true
          if [ "$REF" = nightly ] && [ "$(git rev-parse -q --verify 'refs/tags/nightly^{commit}' || true)" = "$head" ] \
             && gh release view nightly --json assets -q '.assets[].name' 2>/dev/null | grep -q -- '-setup.exe$'; then
            if [ "$SIGNING" != true ] || gh release download updates -p nightly.json -O - 2>/dev/null | grep -q "g${head:0:7}"; then
              echo "main has not changed since the last nightly"
              build=false
            fi
          fi
          echo "build=$build" >> "$GITHUB_OUTPUT"

      - name: Rust toolchain
        if: steps.changed.outputs.build == 'true'
        run: |
          rustup toolchain install
          rustup show active-toolchain

      - uses: Swatinem/rust-cache@v2
        if: steps.changed.outputs.build == 'true'

      - uses: actions/setup-node@v5
        if: steps.changed.outputs.build == 'true'
        with:
          node-version: 20
          cache: npm

      - name: Git identity
        if: steps.changed.outputs.build == 'true'
        run: |
          git config --global user.name "Nitely CI"
          git config --global user.email "ci@example.com"

      - name: Decide the channel and version
        if: steps.changed.outputs.build == 'true'
        id: meta
        run: |
          node scripts/release-meta.mjs "$REF" "$(git rev-parse HEAD)" "$(git rev-list --count HEAD)" | tee -a "$GITHUB_OUTPUT"
          # The previous release, for the notes: for a stable one the previous stable (so its notes
          # cover everything its betas had), else the previous beta or stable. None: the first.
          if grep -q '^channel=stable$' <(node scripts/release-meta.mjs "$REF" x 1); then exclude='*-*'; else exclude='*-test.*'; fi
          prev=$(git describe --tags --abbrev=0 --match 'v[0-9]*' --exclude "$exclude" --exclude "$REF" HEAD 2>/dev/null || true)
          echo "previous=$prev" | tee -a "$GITHUB_OUTPUT"

      - run: npm ci
        if: steps.changed.outputs.build == 'true'

      - name: Gate
        if: steps.changed.outputs.build == 'true'
        run: |
          npm run build
          npm test
          cargo test --workspace --locked
          cargo clippy --workspace --locked -- -D warnings

      - name: Stamp the version
        if: steps.changed.outputs.build == 'true'
        run: node scripts/version.mjs set "${{ steps.meta.outputs.version }}"

      - name: Build the nitely CLI
        if: steps.changed.outputs.build == 'true'
        env:
          # Built into the CLI and the app: `nitely --version` names it, and the app's updater
          # follows it by default. Builds from source are "dev" and never update themselves.
          NITELY_CHANNEL: ${{ steps.meta.outputs.channel }}
        run: |
          cargo build --release --locked -p nitely-cli
          mkdir -p src-tauri/binaries
          cp target/release/nitely.exe src-tauri/binaries/nitely-x86_64-pc-windows-msvc.exe
          target/release/nitely.exe --version

      - name: Build the installer
        if: steps.changed.outputs.build == 'true'
        env:
          NITELY_CHANNEL: ${{ steps.meta.outputs.channel }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          # Updater artifacts need both halves of the key: the secret to sign, and the public key in
          # tauri.conf.json (plugins.updater.pubkey) for installed copies to check.
          pubkey=$(node -e "console.log(require('./src-tauri/tauri.conf.json').plugins?.updater?.pubkey ?? '')")
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ] && [ -n "$pubkey" ]; then
            npx tauri build --config src-tauri/tauri.release.json --config '{"bundle":{"createUpdaterArtifacts":true}}'
          else
            missing=()
            [ -z "$TAURI_SIGNING_PRIVATE_KEY" ] && missing+=("the TAURI_SIGNING_PRIVATE_KEY repository secret")
            [ -z "$pubkey" ] && missing+=("plugins.updater.pubkey in src-tauri/tauri.conf.json")
            echo "::warning::Updates are off for this build: no updater key ($(IFS=,; echo "${missing[*]}" | sed 's/,/ and /') missing). The installer is published without an updater signature, no update manifest changes, and the app it installs doesn't check for updates. docs/releasing.md, \"The updater signing key\", sets it up."
            npx tauri build --config src-tauri/tauri.release.json
          fi
          ls -l target/release/bundle/nsis

      - name: Collect the release files
        if: steps.changed.outputs.build == 'true'
        id: files
        run: |
          v="${{ steps.meta.outputs.version }}"
          mkdir -p out
          setup=$(ls target/release/bundle/nsis/*-setup.exe | head -1)
          cp "$setup" "out/Nitely_${v}_x64-setup.exe"
          [ -f "$setup.sig" ] && cp "$setup.sig" "out/Nitely_${v}_x64-setup.exe.sig"
          cp target/release/nitely.exe "out/nitely_${v}_x86_64-pc-windows-msvc.exe"
          (cd out && sha256sum * > SHA256SUMS.txt)
          ls -l out

      # Install what users will download, silently, on this runner, as on a machine without Rust:
      # Cargo's folder is taken off PATH, so the CLI must land in a folder Windows keeps on PATH.
      - name: Check the installer
        if: steps.changed.outputs.build == 'true'
        shell: pwsh
        run: |
          $v = "${{ steps.meta.outputs.version }}"
          $env:PATH = ($env:PATH -split ";" | Where-Object { $_ -and $_ -notmatch "\\.cargo\\bin" }) -join ";"
          Remove-Item (Join-Path $env:USERPROFILE ".cargo\bin\nitely.exe") -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath "out\Nitely_${v}_x64-setup.exe" -ArgumentList "/S" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "the installer exited with $($p.ExitCode)" }
          $dir = @("Nitely", "Programs\Nitely") | ForEach-Object { Join-Path $env:LOCALAPPDATA $_ } | Where-Object { Test-Path (Join-Path $_ "nitely.exe") } | Select-Object -First 1
          if (-not $dir) { throw "found no install folder holding the app and nitely.exe" }
          $app = Get-ChildItem $dir -Filter *.exe | Where-Object { $_.Name -notin @("nitely.exe", "uninstall.exe") } | Select-Object -First 1
          if (-not $app) { Get-ChildItem $dir; throw "no app executable in $dir" }
          $cli = (Get-Command nitely -ErrorAction SilentlyContinue).Source
          if (-not $cli) { throw "the installer put no nitely CLI on PATH, where agents find it" }
          $out = & $cli --version
          Write-Output "installed $app; CLI at ${cli}: $out"
          if ("$out" -notmatch [regex]::Escape($v)) { throw "the installed CLI says '$out', not $v" }

      # Provenance for what a tag publishes: which workflow, commit and run built each file, signed
      # keylessly through Sigstore and kept by GitHub. Anyone checks a download with
      # `gh attestation verify <file> -R <this repo>`. Not for the nightly, which is replaced daily.
      # The attestation names the run's own ref and commit (its OIDC token's), so only a run on the
      # tag it builds attests: a pushed tag, or a dispatch from the tag (promote.yml's). A rebuild
      # dispatched from a branch would claim the branch's commit, so it is published unattested.
      - name: Check the run is on the tag it builds
        if: steps.changed.outputs.build == 'true' && steps.meta.outputs.tag != 'nightly'
        id: attest
        run: |
          if [ "$GITHUB_REF" = "refs/tags/${{ steps.meta.outputs.tag }}" ] && [ "$GITHUB_SHA" = "$(git rev-parse HEAD)" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Not attested: this run is on $GITHUB_REF, not the tag ${{ steps.meta.outputs.tag }} it builds. To attest a rebuild, run it from the tag: gh workflow run release.yml --ref ${{ steps.meta.outputs.tag }} -f ref=${{ steps.meta.outputs.tag }}"
          fi

      - name: Attest the release files
        if: steps.attest.outputs.ok == 'true'
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            out/*-setup.exe
            out/nitely_*.exe
            out/SHA256SUMS.txt

      - name: Write the notes
        if: steps.changed.outputs.build == 'true'
        run: |
          since=()
          [ -n "${{ steps.meta.outputs.previous }}" ] && since=(--since "${{ steps.meta.outputs.previous }}")
          target/release/nitely.exe release-notes --version "${{ steps.meta.outputs.version }}" "${since[@]}" --github "$GITHUB_REPOSITORY" > notes.md
          cat >> notes.md <<'EOF'

          ---
          **Installing:** download `Nitely_*_x64-setup.exe` and run it; no administrator rights are needed. The installer is not code-signed, so Windows SmartScreen warns the first time: choose **More info**, then **Run anyway**. The `nitely_*` file is the command-line tool on its own.
          EOF
          echo >> notes.md
          if [ "${{ steps.meta.outputs.tag }}" = nightly ]; then
            echo '**Checking a download:** `SHA256SUMS.txt` lists each file'"'"'s SHA-256; compare it with `Get-FileHash <file>` in PowerShell. Tagged releases also carry a GitHub build attestation.' >> notes.md
          else
            echo '**Checking a download:** `gh attestation verify <file> -R '"$GITHUB_REPOSITORY"'` shows that this repository'"'"'s release workflow built the file from this tag. `SHA256SUMS.txt` lists each file'"'"'s SHA-256 (`Get-FileHash <file>` in PowerShell).' >> notes.md
          fi
          cat notes.md

      - name: Publish the release
        if: steps.changed.outputs.build == 'true'
        run: |
          tag="${{ steps.meta.outputs.tag }}"
          flags=()
          [ "${{ steps.meta.outputs.prerelease }}" = true ] && flags+=(--prerelease)
          [ "${{ steps.meta.outputs.draft }}" = true ] && flags+=(--draft)
          if [ "$tag" = nightly ]; then
            # The rolling nightly: the previous one goes, with its tag, and the new release makes
            # the tag on this commit as it is created, so a failed create leaves no tag behind.
            gh release delete nightly --yes --cleanup-tag 2>/dev/null || true
            flags+=(--target "$(git rev-parse HEAD)")
          else
            flags+=(--verify-tag)
          fi
          gh release create "$tag" out/* --title "${{ steps.meta.outputs.title }}" --notes-file notes.md "${flags[@]}"

      - name: Update the channel manifests
        if: steps.changed.outputs.build == 'true' && steps.meta.outputs.manifests != ''
        run: |
          v="${{ steps.meta.outputs.version }}"
          sig="out/Nitely_${v}_x64-setup.exe.sig"
          if [ ! -f "$sig" ]; then
            echo "::warning::No updater signature, so the ${{ steps.meta.outputs.manifests }} manifest stays as it was."
            exit 0
          fi
          gh release view updates >/dev/null 2>&1 || gh release create updates --prerelease --title "Update manifests" \
            --notes "What installed copies of Nitely read to find their channel's newest version. Not a release to download."
          # Builds for different tags run side by side, and reading, comparing and uploading a
          # manifest isn't atomic. So no build writes its own version: each writes the newest
          # published release of the channel, from the releases as they are now. Builds finishing
          # together then write the same thing, and one that read the list before a newer release
          # was published puts it right on a later read-back, as does the newer build itself.
          publish() { # channel: derive the manifest from the releases now, and upload it when the published one is older
            local channel="$1"
            gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/releases?per_page=100" > releases.json
            local status=0
            node scripts/update-manifest.mjs --pick "$channel" --releases releases.json --notes-out "notes-$channel.md" > "pick-$channel.env" || status=$?
            if [ "$status" = 5 ]; then echo "::notice::No published release for $channel yet."; return 0; elif [ "$status" != 0 ]; then return "$status"; fi
            . "./pick-$channel.env"
            rm -f "current-$channel.json"
            gh release download updates -p "$channel.json" -O "current-$channel.json" 2>/dev/null || true
            gh release download "$tag" -p "$sig" -O "sig-$channel" --clobber
            status=0
            node scripts/update-manifest.mjs --version "$version" --url "$url" --sig "sig-$channel" --notes "notes-$channel.md" --out "$channel.json" --current "current-$channel.json" || status=$?
            if [ "$status" = 3 ]; then return 0; elif [ "$status" != 0 ]; then return "$status"; fi
            # Already published as it should be (same version, installer and signature): leave it.
            node scripts/update-manifest.mjs --same "$channel.json" --as "current-$channel.json" && return 0
            gh release upload updates "$channel.json" --clobber
            echo "$channel.json names $version ($tag)"
          }
          for channel in ${{ steps.meta.outputs.manifests }}; do publish "$channel"; done
          for check in 1 2 3; do
            sleep 20
            for channel in ${{ steps.meta.outputs.manifests }}; do publish "$channel"; done
          done
