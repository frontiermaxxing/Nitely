# The gate from .nitely/playbook.toml, on every pull request into main and every push to main.
# Each gate command is one step, spelled exactly as the playbook spells it: a test in
# crates/nitely-core/src/playbook.rs fails when the two differ. The frontend builds first because
# the Tauri crate embeds dist/ when it compiles.

# A dispatch that names nitely_run is Nitely's CI executor (executor.rs, docs/build-lanes.md): it
# runs only the suite job below, on Linux, one job per requested command, at the exact commit and
# tree Nitely pushed to nitely_ref. The gate jobs do not run for it.

# nitely-exact-release-v1: dispatch accepts the final channel on the stamped candidate.
name: CI
run-name: ${{ inputs.nitely_run && format('Nitely suite {0}', inputs.nitely_run) || '' }}

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Release candidate channel; dev for ordinary manual checks"
        default: dev
      nitely_run:
        description: "Nitely's request id; set only by Nitely's CI executor"
        default: ""
      nitely_ref:
        description: "The ref Nitely pushed the tree to (refs/nitely/ci/<run>)"
        default: ""
      nitely_sha:
        description: "The commit that ref must point at"
        default: ""
      nitely_tree:
        description: "The tree that commit must have"
        default: ""
      nitely_commands:
        description: "The commands to run, a JSON array of strings; one job each"
        default: "[]"
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Keyed by event and pull request too (NIT-540): a pull request whose head is already on main (a
# land fast-forwards it there) runs with github.ref = refs/heads/main, and would otherwise share the
# push run's group and cancel it.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}-${{ inputs.nitely_run || 'gate' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  gate:
    name: Gate (${{ matrix.os }})
    if: ${{ !inputs.nitely_run }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      NITELY_CHANNEL: ${{ inputs.channel || 'dev' }}
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
    steps:
      # The runner's TEMP is an 8.3 short path (C:\Users\RUNNER~1\...), which the tests run under
      # on purpose: paths::normalize spells short names out (NIT-104).
      - uses: actions/checkout@v5

      # Tauri's Linux prerequisites, for the app crate (nitely-app) that `cargo test --workspace`
      # builds, plus D-Bus for the keychain (keyring's Secret Service). No Linux bundle is built yet.
      - name: Linux prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev pkg-config

      # rustup installs the toolchain rust-toolchain.toml pins, with clippy.
      - name: Rust toolchain
        run: |
          rustup toolchain install
          rustup show active-toolchain

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      # Tests make throwaway git repos; some commit without passing an identity.
      - name: Git identity
        run: |
          git config --global user.name "Nitely CI"
          git config --global user.email "ci@example.com"

      - run: npm ci

      - run: npm run build

      - run: npm test

      # On Linux, each test binary through the runner that turns on libtest's per-test times, as
      # the suite job below does: `measure` reads this job's log first, and without the times no
      # Rust test can be found slow (NIT-593). RUSTC_BOOTSTRAP reaches only the test binary.
      - name: Per-test times
        if: runner.os == 'Linux'
        run: |
          runner="$RUNNER_TEMP/test-runner.sh"
          cat > "$runner" <<'RUNNER'
          bin="$1"
          shift
          case " $* " in
            *" --list "* | *" --bench "* | *" --format"* | *" --report-time "* | *" -q "* | *" --quiet "*) exec "$bin" "$@" ;;
          esac
          RUSTC_BOOTSTRAP=1 exec "$bin" "$@" -Z unstable-options --report-time
          RUNNER
          echo "CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER=bash $runner" >> "$GITHUB_ENV"

      - run: cargo test --workspace

      - run: cargo clippy --workspace -- -D warnings

      # The Mac app and disk image, built as a release builds them, with the CLI inside: proves the
      # app bundles on a Mac. Unsigned; nothing is published from here.
      - name: Mac bundle
        if: runner.os == 'macOS'
        run: |
          cargo build --release --locked -p nitely-cli
          triple=$(rustc -vV | sed -n 's/^host: //p')
          mkdir -p src-tauri/binaries
          cp target/release/nitely "src-tauri/binaries/nitely-$triple"
          npx tauri build --config src-tauri/tauri.release.json --bundles app,dmg
          ls -l target/release/bundle/dmg target/release/bundle/macos/Nitely.app/Contents/MacOS
          # The app and the CLI side by side: Mac file names ignore case, so the app's own binary
          # must not be called Nitely, or it and the CLI would be one file.
          test -x target/release/bundle/macos/Nitely.app/Contents/MacOS/nitely-app
          test -x target/release/bundle/macos/Nitely.app/Contents/MacOS/nitely
          target/release/bundle/macos/Nitely.app/Contents/MacOS/nitely --version

      - name: Mac bundle files
        if: runner.os == 'macOS' && always()
        uses: actions/upload-artifact@v4
        with:
          name: mac-bundle
          path: target/release/bundle/dmg/*.dmg
          if-no-files-found: ignore

  # Nitely's full-suite request. The commands come from the person's own playbook through a
  # dispatch only someone with write access can make; each runs from an environment variable, never
  # pasted into the script. The job fails unless the checkout is exactly the commit and tree Nitely
  # asked for, so a pass is evidence for that tree and no other.
  suite:
    name: ${{ matrix.command }}
    if: ${{ inputs.nitely_run }}
    strategy:
      fail-fast: false
      matrix:
        command: ${{ fromJSON(inputs.nitely_commands) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NITELY_CHANNEL: dev
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v5

      - name: The exact tree
        env:
          NITELY_REF: ${{ inputs.nitely_ref }}
          NITELY_SHA: ${{ inputs.nitely_sha }}
          NITELY_TREE: ${{ inputs.nitely_tree }}
        run: |
          case "$NITELY_REF" in refs/nitely/ci/*) ;; *) echo "not a Nitely CI ref: $NITELY_REF"; exit 1;; esac
          git fetch --no-tags --depth=1 origin "+$NITELY_REF:refs/nitely-run"
          git checkout --force --detach refs/nitely-run
          test "$(git rev-parse HEAD)" = "$NITELY_SHA" || { echo "ref is not at $NITELY_SHA"; exit 1; }
          test "$(git rev-parse 'HEAD^{tree}')" = "$NITELY_TREE" || { echo "commit's tree is not $NITELY_TREE"; exit 1; }
          echo "Running at commit $NITELY_SHA, tree $NITELY_TREE"

      - name: Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev pkg-config

      - name: Rust toolchain
        run: |
          rustup toolchain install
          rustup show active-toolchain

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: nitely-suite

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Git identity
        run: |
          git config --global user.name "Nitely CI"
          git config --global user.email "ci@example.com"

      # The Tauri crate embeds dist/ when it compiles, so every job builds the frontend first.
      - run: npm ci
      - run: npm run build

      # A cargo test thread count only schedules the run on the machine it was tuned for (the
      # gate's 12 for the lanes, NIT-458); the same tests run either way (NIT-474). Here it is the
      # runner's cores: 12 threads on a 4-core runner starve the timing-sensitive lane tests.
      # Each test binary through a runner that turns on libtest's per-test times for the test budget
      # (NIT-522), as `nitely test-runner` does in a lane; Nitely reads them from this job's log.
      # RUSTC_BOOTSTRAP reaches only the test binary, so the build is the one without it. The runner
      # is written here, not kept in the repo, so a tree from before it still runs.
      - name: Run
        env:
          NITELY_COMMAND: ${{ matrix.command }}
        run: |
          runner="$RUNNER_TEMP/test-runner.sh"
          cat > "$runner" <<'RUNNER'
          bin="$1"
          shift
          case " $* " in
            *" --list "* | *" --bench "* | *" --format"* | *" --report-time "* | *" -q "* | *" --quiet "*) exec "$bin" "$@" ;;
          esac
          RUSTC_BOOTSTRAP=1 exec "$bin" "$@" -Z unstable-options --report-time
          RUNNER
          export CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER="bash $runner"
          # A command `measure` dispatched writes its runner's report here (NIT-567).
          export NITELY_JUNIT_DIR="$RUNNER_TEMP/nitely-junit"
          mkdir -p "$NITELY_JUNIT_DIR"
          command=$(printf '%s' "$NITELY_COMMAND" | sed -E "s/--test-threads=[0-9]+/--test-threads=$(nproc)/")
          echo "Running: $command"
          bash -c "$command"

      # The reports `measure` reads back for this command: what it wrote to NITELY_JUNIT_DIR, and
      # Maven's and Gradle's own JUnit folders (NIT-567).
      - name: Test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: nitely-report-${{ inputs.nitely_run }}-${{ strategy.job-index }}
          path: |
            ${{ runner.temp }}/nitely-junit
            **/target/surefire-reports/*.xml
            **/build/test-results/**/*.xml
          if-no-files-found: ignore
          retention-days: 3
