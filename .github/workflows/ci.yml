# The gate from .nitely/playbook.toml, on every pull request into main and every push to main.
# Each gate command is one step, spelled exactly as the playbook spells it: a test in
# crates/nitely-core/src/playbook.rs fails when the two differ. The frontend builds first because
# the Tauri crate embeds dist/ when it compiles.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  gate:
    name: Gate (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
    steps:
      # The runner's TEMP is an 8.3 short path (C:\Users\RUNNER~1\...), which the tests run under
      # on purpose: paths::normalize spells short names out (NIT-104).
      - uses: actions/checkout@v5

      # Tauri's Linux prerequisites, for the app crate (nitely-app) that `cargo test --workspace`
      # builds, plus D-Bus for the keychain (keyring's Secret Service). No Linux bundle is built yet.
      - name: Linux prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev pkg-config

      # rustup installs the toolchain rust-toolchain.toml pins, with clippy.
      - name: Rust toolchain
        run: |
          rustup toolchain install
          rustup show active-toolchain

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      # Tests make throwaway git repos; some commit without passing an identity.
      - name: Git identity
        run: |
          git config --global user.name "Nitely CI"
          git config --global user.email "ci@example.com"

      - run: npm ci

      - run: npm run build

      - run: npm test

      - run: cargo test --workspace

      - run: cargo clippy --workspace -- -D warnings

      # The Mac app and disk image, built as a release builds them, with the CLI inside: proves the
      # app bundles on a Mac. Unsigned; nothing is published from here.
      - name: Mac bundle
        if: runner.os == 'macOS'
        run: |
          cargo build --release --locked -p nitely-cli
          triple=$(rustc -vV | sed -n 's/^host: //p')
          mkdir -p src-tauri/binaries
          cp target/release/nitely "src-tauri/binaries/nitely-$triple"
          npx tauri build --config src-tauri/tauri.release.json --bundles app,dmg
          ls -l target/release/bundle/dmg target/release/bundle/macos/Nitely.app/Contents/MacOS
          # The app and the CLI side by side: Mac file names ignore case, so the app's own binary
          # must not be called Nitely, or it and the CLI would be one file.
          test -x target/release/bundle/macos/Nitely.app/Contents/MacOS/nitely-app
          test -x target/release/bundle/macos/Nitely.app/Contents/MacOS/nitely
          target/release/bundle/macos/Nitely.app/Contents/MacOS/nitely --version

      - name: Mac bundle files
        if: runner.os == 'macOS' && always()
        uses: actions/upload-artifact@v4
        with:
          name: mac-bundle
          path: target/release/bundle/dmg/*.dmg
          if-no-files-found: ignore
