[workspace]
resolver = "2"
members = ["crates/nitely-core", "crates/nitely-cli", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"

[workspace.dependencies]
nitely-core = { path = "crates/nitely-core" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
rusqlite = { version = "0.40", features = ["bundled"] }
dirs = "6"
clap = { version = "4", features = ["derive"] }
