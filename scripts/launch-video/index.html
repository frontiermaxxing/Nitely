<script>
"use strict";
const W = 1920, H = 1080, Q = CUES;

/* ---------- math ---------- */
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const P = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, x) => a + (b - a) * x;
const E = {
  outExpo: (x) => (x >= 1 ? 1 : 1 - Math.pow(2, -10 * x)),
  inExpo: (x) => (x <= 0 ? 0 : Math.pow(2, 10 * x - 10)),
  outCubic: (x) => 1 - Math.pow(1 - x, 3),
  inCubic: (x) => x * x * x,
  inOut: (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2),
  outBack: (x) => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); },
  outQuint: (x) => 1 - Math.pow(1 - x, 5),
};
function rng(seed) {
  return function () {
    seed |= 0; seed = (seed + 0x6d2b79f5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
// Smooth deterministic noise, -1..1.
const nz = (x, s = 0) => (Math.sin(x * 1.7 + s) + Math.sin(x * 3.1 + s * 2.3) * 0.5 + Math.sin(x * 5.3 + s * 0.7) * 0.25) / 1.75;
// Decaying impulse after each time in `times`.
const hits = (t, times, rate = 10) => times.reduce((a, s) => a + (t >= s ? Math.exp(-(t - s) * rate) : 0), 0);

function oklch(L, C, h) {
  h = (h * Math.PI) / 180;
  const a = C * Math.cos(h), b = C * Math.sin(h);
  const l = (L + 0.3963377774 * a + 0.2158037573 * b) ** 3;
  const m = (L - 0.1055613458 * a - 0.0638541728 * b) ** 3;
  const s = (L - 0.0894841775 * a - 1.291485548 * b) ** 3;
  const f = (x) => { x = clamp(x); return Math.round(255 * (x <= 0.0031308 ? 12.92 * x : 1.055 * Math.pow(x, 1 / 2.4) - 0.055)); };
  return [f(4.0767416621 * l - 3.3077115913 * m + 0.2309699292 * s), f(-1.2684380046 * l + 2.6097574011 * m - 0.3413193965 * s), f(-0.0041960863 * l - 0.7034186147 * m + 1.707614701 * s)];
}
const rgb = (c, a = 1) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;
const C = {
  live: oklch(0.78, 0.13, 170), amber: oklch(0.81, 0.14, 75), fail: oklch(0.7, 0.17, 25),
  claude: oklch(0.64, 0.14, 42), codex: oklch(0.6, 0.09, 255), cursor: oklch(0.5, 0.012, 260),
  fg: [236, 235, 230], fg2: [167, 166, 159], fg3: [124, 123, 117], line: [54, 54, 51],
};
const root = document.documentElement.style;
root.setProperty("--live", rgb(C.live)); root.setProperty("--amber", rgb(C.amber)); root.setProperty("--fail", rgb(C.fail));
const VEND = { Cl: C.claude, Cx: C.codex, Cu: C.cursor };

/* ---------- dom helpers ---------- */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
function h(html) { const d = document.createElement("div"); d.innerHTML = html.trim(); return d.firstChild; }
function tf(el, o = {}) {
  const { x = 0, y = 0, s = 1, sx = 1, sy = 1, r = 0, rx = 0, ry = 0, o: op = 1, blur = 0 } = o;
  el.style.transform = `translate3d(${x.toFixed(2)}px,${y.toFixed(2)}px,0) rotateX(${rx}deg) rotateY(${ry}deg) rotate(${r}deg) scale(${s * sx},${s * sy})`;
  el.style.opacity = clamp(op).toFixed(3);
  el.style.filter = blur > 0.1 ? `blur(${blur.toFixed(1)}px)` : "none";
  el.style.visibility = op <= 0.002 ? "hidden" : "visible";
}
function words(el) {
  const text = el.textContent; el.textContent = "";
  const spans = [];
  for (const w of text.split(/(\s+)/).filter((x) => x.length)) {
    if (/^\s+$/.test(w)) { el.appendChild(document.createTextNode(" ")); continue; }
    const s = document.createElement("span"); s.className = "w"; s.textContent = w; el.appendChild(s); spans.push(s);
  }
  return spans;
}
function letters(el) {
  const text = el.textContent; el.textContent = "";
  return [...text].map((ch) => { const s = document.createElement("span"); s.className = "w"; s.textContent = ch; el.appendChild(s); return s; });
}
// Words rise out of a blur, and leave upward.
function rise(spans, t, at, { stagger = 0.06, dur = 0.55, dy = 70, out = null, outDur = 0.35 } = {}) {
  spans.forEach((sp, i) => {
    const k = E.outExpo(P(t, at + i * stagger, at + i * stagger + dur));
    let y = (1 - k) * dy, o = k, blur = (1 - k) * 14;
    if (out != null) { const e = E.inCubic(P(t, out + i * 0.025, out + i * 0.025 + outDur)); y -= e * dy * 0.7; o *= 1 - e; blur += e * 12; }
    tf(sp, { y, o, blur });
  });
}

/* ---------- canvases ---------- */
const bg = $("#bg").getContext("2d"), fx = $("#fx").getContext("2d");
const grain = [];
{
  const R = rng(99);
  for (let g = 0; g < 6; g++) {
    const c = document.createElement("canvas"); c.width = c.height = 512;
    const x = c.getContext("2d"), img = x.createImageData(512, 512);
    for (let i = 0; i < img.data.length; i += 4) { const v = R() * 255; img.data[i] = img.data[i + 1] = img.data[i + 2] = v; img.data[i + 3] = 255; }
    x.putImageData(img, 0, 0); grain.push(c);
  }
}
function glow(ctx, x, y, r, c, a) {
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, rgb(c, a)); g.addColorStop(1, rgb(c, 0));
  ctx.fillStyle = g; ctx.fillRect(x - r, y - r, 2 * r, 2 * r);
}
function disc(ctx, x, y, r, c, a = 1) { ctx.beginPath(); ctx.arc(x, y, Math.max(0, r), 0, Math.PI * 2); ctx.fillStyle = rgb(c, a); ctx.fill(); }

/* ================= scene 1: cold open ================= */
const s1 = {
  clock: $("#clock"), l1: words($("#l1")), l2: words($("#l2")),
  levels: [], colors: [],
};
{
  const R = rng(7), radii = [300, 200, 135, 92, 64, 46];
  s1.levels.push([{ x: 960, y: 420 }]);
  for (let k = 0; k < 6; k++) {
    const next = [];
    for (const d of s1.levels[k]) {
      const ang = k === 0 ? 0.08 : R() * Math.PI * 2, r = radii[k] * (0.85 + 0.3 * R());
      const dx = Math.cos(ang) * r, dy = Math.sin(ang) * r * 0.6;
      next.push({ x: d.x + dx, y: d.y + dy }, { x: d.x - dx, y: d.y - dy });
    }
    s1.levels.push(next);
  }
  const R2 = rng(11);
  s1.colors = s1.levels[6].map(() => { const v = R2(); return v < 0.62 ? C.live : v < 0.82 ? C.claude : v < 0.94 ? C.codex : C.fg2; });
}
const DOT_R = [15, 12.5, 10.5, 9, 8, 7, 6];
function swarm(t) {
  // Where each dot is, how big, and its color.
  const D = Q.doublings;
  let L = 0; while (L < 6 && t >= D[L]) L++;
  const k = L === 0 ? 1 : E.outBack(P(t, D[L - 1], D[L - 1] + 0.42));
  const rootY = lerp(540, 420, E.inOut(P(t, 1.25, 1.9)));
  const pts = s1.levels[L].map((d, j) => {
    const par = L === 0 ? d : s1.levels[L - 1][j >> 1];
    let x = lerp(par.x, d.x, k), y = lerp(par.y, d.y, k);
    if (L === 0 || (L === 1 && k < 1)) y += rootY - 420;
    const amp = 46 * E.inCubic(P(t, 6.6, 8.1));
    x += amp * nz(t * 1.3, j * 1.9); y += amp * 0.8 * nz(t * 1.1, j * 3.7 + 5);
    const ci = j * (1 << (6 - L));
    return { x, y, r: lerp(DOT_R[Math.max(0, L - 1)], DOT_R[L], k), c: L >= 4 ? s1.colors[ci] : C.live };
  });
  return pts;
}

  s5.stats.innerHTML = `<span><b style="color:${rgb(C.live)}">${n(23)}</b> landed</span><span><b>${n(55)}</b> filed</span><span><b>${n(69)}</b> review rounds</span><span><b style="color:${rgb(C.amber)}">${n(2)}</b> questions for you</span>`;
  tf(s5.stats, { o: P(t, Q.night + 0.3, Q.night + 0.7) * (1 - P(t, Q.wake - 0.3, Q.wake)) });
  rise(s5.wakeA, t, Q.wake, { stagger: 0.07, out: 55.7 });
  rise(s5.wakeB, t, Q.notNoise, { stagger: 0.1, out: 55.75 });
  $("#wakeB").style.color = rgb(C.amber);
}

/* ================= scene 6: end ================= */
const s6 = { eyebrow: $("#eyebrow"), logo: $("#logo2"), mark: $("#mark2"), word: $("#word2"), tag: words($("#endtag")), fine: $("#endfine"), url: $("#endurl") };
s6.letters = letters(s6.word);
function updateS6(t) {
  const L = Q.endLines, e = Q.end;
  const wordW = s6.word.offsetWidth, gap = 40, groupW = 230 + gap + wordW, x0 = 960 - groupW / 2, cy = 480;
  const mk = E.outExpo(P(t, e, e + 0.6));
  tf(s6.mark, { x: x0, y: cy - 52, s: lerp(1.6, 1, mk), o: mk });
  tf(s6.word, { x: x0 + 230 + gap, y: cy - 88 });
  s6.letters.forEach((sp, i) => { const k = E.outExpo(P(t, e + 0.15 + i * 0.045, e + 0.8 + i * 0.045)); tf(sp, { x: (1 - k) * -70, o: k, blur: (1 - k) * 14 }); });
  const f = P(t, Q.fade, Q.fade + 1.1);
  s6.logo.style.opacity = 1;
  [...s6.mark.children].forEach((c) => { if (c.id !== "m2C2") c.style.opacity = 1 - f; });
  s6.word.style.opacity = 1 - f;
  const breath = 1 + 0.12 * Math.sin(((t - Q.fade) / 2.4) * Math.PI * 2) * P(t, Q.fade, Q.fade + 0.6);
  $("#m2C2").style.transform = `scale(${breath * (1 - E.inCubic(P(t, 63.2, 63.9)))})`;
  tf(s6.eyebrow, { o: E.outExpo(P(t, L[0], L[0] + 0.5)) * (1 - f), y: (1 - E.outExpo(P(t, L[0], L[0] + 0.6))) * 20 });
  rise(s6.tag, t, L[1], { stagger: 0.05, out: Q.fade });
  tf(s6.fine, { o: E.outExpo(P(t, L[3], L[3] + 0.5)) * (1 - f), y: (1 - E.outExpo(P(t, L[3], L[3] + 0.6))) * 20 });
  tf(s6.url, { o: E.outExpo(P(t, L[4], L[4] + 0.5)) * (1 - f), s: lerp(0.85, 1, E.outBack(P(t, L[4], L[4] + 0.5))) });
}

/* ================= background & fx ================= */
const STARS = (() => { const R = rng(3); return Array.from({ length: 260 }, () => ({ x: R() * W, y: R() * H * 0.8, r: 0.5 + R() * 1.6, p: R() * 6 })); })();
const BURST = (() => { const R = rng(17); return Array.from({ length: 160 }, () => { const a = R() * Math.PI * 2, v = 300 + R() * 1300; return { vx: Math.cos(a) * v, vy: Math.sin(a) * v * 0.7, r: 1 + R() * 3, c: R() < 0.7 ? C.live : R() < 0.5 ? C.fg : C.amber }; }); })();
const STREAM = (() => {
  const R = rng(31), items = ["gate passed · npm test", "review passed", "landed", "filed", "claimed", "rebased on main", "submitted", "worktree ready", "review: 0 findings", "gate passed · cargo test", "handoff note", "build lane 2 · done"];
  const keys = ["NIT-4", "APP-2", "ORB-1", "HAR-3"];
  return Array.from({ length: 90 }, () => ({ x: 60 + R() * 1800, y: R() * 1400, v: 160 + R() * 260, txt: `${keys[Math.floor(R() * 4)]}${Math.floor(R() * 90 + 10)}  ${items[Math.floor(R() * items.length)]}`, a: 0.2 + R() * 0.5 }));
})();
function drawBg(t) {
  bg.globalCompositeOperation = "source-over";
  // Night blends the base toward deep blue, dawn warms the bottom.
  const night = P(t, 47.6, 48.4) * (1 - P(t, 55.6, 56.2));
  const dawn = E.inOut(P(t, 51.5, 54.5)) * (1 - P(t, 55.6, 56.2));
  const base = [lerp(13, 9, night), lerp(13, 11, night), lerp(12, 20, night)];
  bg.fillStyle = rgb(base); bg.fillRect(0, 0, W, H);
  bg.save(); bg.globalCompositeOperation = "lighter";
  // Ambient light per section.
  const amb = (x, y, r, c, a) => a > 0.003 && glow(bg, x, y, r, c, a);
  amb(960, 460, 900, C.live, 0.07 * P(t, 0.2, 2) * (1 - P(t, 7.5, 8.2)));
  amb(960 + 200 * nz(t * 0.7), 540, 1100, C.fail, (0.09 + 0.06 * Math.abs(nz(t * 9))) * P(t, 8, 9) * (1 - P(t, 14.4, 14.55)));
  const dropGlow = hits(t, [Q.drop], 1.6);
  amb(960, 470, 1200, C.fg, 0.05 * dropGlow * (t < 22 ? 1 : 0));
  amb(960, 470, 900, C.live, 0.08 * P(t, 16, 16.4) * (1 - P(t, 21.5, 22.2)));
  const featC = t < 42 ? C.live : C.amber;
  amb(1330 + 120 * nz(t * 0.4, 2), 540, 1000, featC, 0.075 * P(t, 21.8, 22.6) * (1 - P(t, 47.4, 48)));
  amb(300, 300, 800, C.codex, 0.06 * P(t, 21.8, 22.6) * (1 - P(t, 47.4, 48)));
  amb(960, 1300, 1300, [255, 160, 80], 0.5 * dawn);
  amb(960, 1150, 700, [255, 200, 120], 0.35 * dawn);
  amb(960, 520, 1100, C.fg, 0.035 * hits(t, [Q.end], 1.5) * (t >= Q.end ? 1 : 0));
  amb(960, 480, 700, C.live, 0.05 * P(t, Q.end, Q.end + 1) * (1 - P(t, Q.fade, Q.fade + 1)));
  bg.restore();
  // Stars.
  if (night > 0) for (const s of STARS) {
    const tw = 0.5 + 0.5 * Math.sin(t * 2.2 + s.p * 3);
    disc(bg, s.x, s.y - (t - 48) * 6 * s.r, s.r, [230, 230, 255], night * (1 - dawn * 0.85) * (0.25 + 0.6 * tw));
  }
  drawSwarm(t);
  // Burst at the drop.
  const bt = t - Q.drop;
  if (bt > 0 && bt < 2.2) {
    bg.save(); bg.globalCompositeOperation = "lighter";
    for (const p of BURST) {
      const drag = (1 - Math.exp(-bt * 3)) / 3;
      const x = 960 + p.vx * drag, y = 470 + p.vy * drag, a = Math.max(0, 1 - bt / 2.2);
      disc(bg, x, y, p.r, p.c, a);
    }
    for (let i = 0; i < 3; i++) {
      const e = P(bt, i * 0.07, 0.9 + i * 0.07); if (e <= 0 || e >= 1) continue;
      bg.beginPath(); bg.ellipse(960, 470, 40 + E.outCubic(e) * 1100, 40 + E.outCubic(e) * 700, 0, 0, Math.PI * 2);
      bg.strokeStyle = rgb(i === 0 ? C.fg : C.live, (1 - e) * 0.5); bg.lineWidth = 3 - i; bg.stroke();
    }
    bg.restore();
  }
  // The event stream behind the Inbox: everything the agents settled themselves.
  const sa = P(t, 42, 42.6) * (1 - P(t, 47.3, 47.9));
  if (sa > 0) {
    bg.font = "500 18px GM";
    for (const s of STREAM) {
      const y = ((s.y - (t - 42) * s.v) % 1400 + 1400) % 1400 - 160;
      const fadeNearInbox = s.x > 840 ? 0.3 : 0.45;
      bg.fillStyle = rgb(C.fg3, s.a * sa * fadeNearInbox * 0.55);
      bg.fillText(s.txt, s.x, y);
    }
  }
}
const FLASHES = [[Q.drop, 0.9, 7], [Q.end, 0.3, 7], ...Q.slams.map((s) => [s, 0.12, 8])];
function drawFx(t, frameNo) {
  fx.clearRect(0, 0, W, H);
  // Flash.
  let fl = 0; for (const [at, a, r] of FLASHES) if (t >= at) fl += a * Math.exp(-(t - at) * r);
  if (fl > 0.003) { fx.fillStyle = `rgba(255,255,255,${Math.min(1, fl)})`; fx.fillRect(0, 0, W, H); }
  // Glitch slices in the chaos.
  if (t > 8 && t < 14.5) {
    const R = rng(Math.floor(t * 30)), n = t > 13.5 ? 7 : Q.slams.some((s) => t >= s && t < s + 0.12) ? 4 : R() < 0.15 ? 1 : 0;
    for (let i = 0; i < n; i++) {
      const y = R() * H, hh = 4 + R() * 40;
      fx.fillStyle = R() < 0.5 ? rgb(C.fail, 0.18) : `rgba(80,230,255,0.12)`;
      fx.fillRect(0, y, W, hh);
    }
  }
  // Vignette.
  const v = fx.createRadialGradient(W / 2, H / 2, H * 0.35, W / 2, H / 2, H * 1.05);
  v.addColorStop(0, "rgba(0,0,0,0)"); v.addColorStop(1, "rgba(0,0,0,0.6)");
  fx.fillStyle = v; fx.fillRect(0, 0, W, H);
  // Film grain.
  fx.globalAlpha = 0.045; fx.globalCompositeOperation = "overlay";
  const gimg = grain[frameNo % grain.length], ox = (frameNo * 137) % 512, oy = (frameNo * 311) % 512;
  for (let x = -ox; x < W; x += 512) for (let y = -oy; y < H; y += 512) fx.drawImage(gimg, x, y);
  fx.globalAlpha = 1; fx.globalCompositeOperation = "source-over";
  // Fade in from and out to black.
  const black = 1 - P(t, 0, 0.6) + P(t, 63.3, 64);
  if (black > 0) { fx.fillStyle = `rgba(0,0,0,${clamp(black)})`; fx.fillRect(0, 0, W, H); }
}

/* ================= camera ================= */
function camera(t) {
  const world = $("#world");
  let sh = 22 * hits(t, Q.slams, 9) + (t > 13.6 && t < 14.5 ? 12 : 0) + 30 * hits(t, [Q.drop], 6) + 10 * hits(t, [Q.end], 6) + 5 * hits(t, Q.merges, 12);
  if (t < 8 || (t >= 14.5 && t < 16)) sh = 0;
  const kick = t >= 16 && t < 48 ? 0.006 * Math.exp(-((t - 16) % 0.5) * 12) : 0;
  const drift = 1 + 0.015 * Math.sin(t * 0.21);
  const push = 1 + 0.06 * P(t, 8, 14.5);
  world.style.transform = `translate(${sh * nz(t * 47, 1)}px, ${sh * nz(t * 53, 2)}px) scale(${drift * push * (1 + kick)}) rotate(${0.2 * sh * nz(t * 31, 3) / 10}deg)`;
}

/* ================= driver ================= */
const SCENES = [
  ["#s1", 0, 8.1, updateS1], ["#s2", 8, 14.5, updateS2], ["#s2b", 14.5, 16.0, updateS2b], ["#s3", 16, 22.05, updateS3],
  ["#s4", 21.9, 48.05, (t) => { updateF1(t); updateF2(t); updateF3(t); updateF4(t); updateF5(t); updateF6(t); }],
  ["#s5", 47.9, 56.05, updateS5], ["#s6", 56, 64.1, updateS6],
].map(([sel, a, b, fn]) => ({ el: $(sel), a, b, fn }));
window.seek = function (t, frameNo = Math.round(t * 60)) {
  for (const s of SCENES) {
    const on = t >= s.a && t < s.b;
    s.el.style.display = on ? "block" : "none";
    if (on) s.fn(t);
  }
  camera(t); drawBg(t); drawFx(t, frameNo);
  return true;
};
window.ready = document.fonts.ready.then(() => { seek(0); return true; });
const q = new URLSearchParams(location.search);
if (q.has("t")) window.ready.then(() => seek(parseFloat(q.get("t"))));
if (q.has("play")) window.ready.then(() => { const t0 = performance.now(); const loop = () => { seek(((performance.now() - t0) / 1000) % Q.duration); requestAnimationFrame(loop); }; loop(); });
</script>
</body>
