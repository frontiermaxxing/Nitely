# How work on Nitely flows. Read by `nitely start`, `nitely gate` and the start_task and run_gate
# MCP tools. See crates/nitely-core/src/playbook.rs for every field.

[branch]
integration = "main"
pattern = "{vendor}/{key}-{slug}"

[worktree]
# Beside the repo, so searches in the main checkout never walk task worktrees.
dir = "../{repo}-worktrees/{key}-{slug}"
setup = ["npm ci"]

[gate]
commands = ["cargo test --workspace", "cargo clippy --workspace -- -D warnings", "npm test", "npm run build"]

[review]
# The defaults: Codex reviews Claude's branches, Claude reviews everyone else's.
focus = """Nitely's rules matter most here: only a human approves or answers asks (the CLI and MCP always \
act as agents), hooks never block the agent and never record prompt text, and credentials are read, \
never written or printed. A change that breaks one of these is a P0 or P1 finding."""

# No [approval] rules and no review flags: agents build Nitely themselves, so a passing review approves
# every change here and the agent lands it. A review with P0 or P1 findings still sends it back.

# The crew is off here (workers = 0) until Andrew turns it on. These files nearly every change
# touches, so holding one counts for a quarter when next_task keeps work out of files in flight.
[crew]
shared_files = ["src/App.tsx", "src/types.ts", "src/dev/fixtures.ts", "src-tauri/src/lib.rs", "crates/nitely-cli/src/mcp.rs"]

# land fast-forwards the main checkout but runs no setup there. When a change adds a dependency,
# install it there too, so `npm run tauri dev` keeps working (NIT-81). `npm install` rather than
# `npm ci`: it leaves node_modules in place, so a running dev server keeps going, and a failure is
# only a warning on the land.
[[land.after]]
run = "npm install --no-save --no-audit --no-fund"
when_changed = ['^package(-lock)?\.json$']
