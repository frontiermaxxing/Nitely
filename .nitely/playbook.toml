# How work on Nitely flows. Read by `nitely start`, `nitely gate` and the start_task and run_gate
# MCP tools. See crates/nitely-core/src/playbook.rs for every field.

[branch]
integration = "main"
pattern = "{vendor}/{key}-{slug}"

[worktree]
# Beside the repo, so searches in the main checkout never walk task worktrees.
dir = "../{repo}-worktrees/{key}-{slug}"
setup = ["npm ci"]
mode = "light"

[gate]
commands = ["npm test", "npm run build"]

[review]
# The defaults: Codex reviews Claude's branches, Claude reviews everyone else's.
focus = """Nitely's rules matter most here: only a human approves or answers asks (the CLI and MCP always \
act as agents), hooks never block the agent and never record prompt text, and credentials are read, \
never written or printed. A change that breaks one of these is a P0 or P1 finding."""
batch = "shadow"
batch_window = "5m"
batch_max = 3

# No [approval] rules and no review flags: agents build Nitely themselves, so a passing review approves
# every change here and the agent lands it. A review with P0 or P1 findings still sends it back.

# The crew is off here (workers = 0) until Andrew turns it on. These files nearly every change
# touches, so holding one counts for a quarter when next_task keeps work out of files in flight.
[crew]
shared_files = ["src/App.tsx", "src/types.ts", "src/dev/fixtures.ts", "src-tauri/src/lib.rs", "crates/nitely-cli/src/mcp.rs"]

[land]
batch = "waiting"
batch_max = 5

# Two warm checkouts of this repo that keep target/ and node_modules/ between requests; `run`,
# submit's gate and land's gate run there, one request per lane at a time.
[lanes]
count = 3
keep = ["target", "node_modules"]
# Reminded to use `run` instead when run in a light worktree (never blocked). npm ci stays local:
# the browser preview needs node_modules in the worktree, and it costs 2 s and ~100 MB.
heavy = ["^cargo (build|test|clippy|check)\\b", "^npm (test|run build)\\b"]
timeout_minutes = 75

[review.reviewer]
claude = "codex"
codex = "codex"
"*" = "codex"

[verification]
version = 1
mode = "active"
prose = ['docs/.*\.md']
comments = ['src/.*\.(ts|tsx|js|jsx)', 'crates/.*\.rs', 'src-tauri/src/.*\.rs']
display_copy = ['src/.*\.tsx']
protected = ['src/phone/.*', 'src/approval.*', 'crates/nitely-core/src/(lanes|executor|submit|review|review_batch|accept|project_modes|project_yolo|affected_tests)\.rs']
basic = ['node node_modules/typescript/bin/tsc --noEmit']
audit_percent = 10

[verification.backstop]
enabled = false

[release]
tag = "v*"
exclude_tags = ["*-*"]
stamp_paths = ["Cargo.toml", "Cargo.lock", "package.json", "package-lock.json", "src-tauri/tauri.conf.json"]
commands = ["node scripts/version.mjs"]

[[gate.steps]]
run = "cargo test --workspace -- --test-threads=12"
unless_only = ['^src/', '^scripts/', '^public/', '^index\.html$', '^docs/.*\.md$']

[[gate.steps]]
run = "cargo clippy --workspace -- -D warnings"
unless_only = ['^src/', '^scripts/', '^public/', '^index\.html$', '^docs/.*\.md$']

[[land.after]]
run = "npm install --no-save --no-audit --no-fund"
when_changed = ['^package(-lock)?\.json$']

[[land.after]]
run = "cargo run --release --target-dir {main}/target -p nitely-cli -- install"
when_changed = ['^crates/', '^Cargo\.(toml|lock)$']
outside_lock = true
