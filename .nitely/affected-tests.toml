# The desktop app, a leaf crate. tauri-build reads the configs, capabilities, icons and Windows
# installer hooks, so a change to any of them keeps the full gate. It embeds the built frontend,
# so its checks build that first.
[[components]]
id = "app"
roots = ["src-tauri/"]
build_inputs = ["src-tauri/build.rs", "src-tauri/icons/", "src-tauri/capabilities/", "src-tauri/windows/", "src-tauri/tauri.conf.json", "src-tauri/tauri.macos.conf.json", "src-tauri/tauri.release.json", "src-tauri/tauri.windows.conf.json"]
checks = ["npm run build", "cargo clippy -p nitely-app -- -D warnings"]

[[components.suites]]
id = "lib"
inputs = ["src-tauri/src/"]
[components.suites.cargo]
manifest = "src-tauri/Cargo.toml"
package = "nitely-app"
target_kind = "lib"
