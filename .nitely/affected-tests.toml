# The desktop app, a leaf crate. tauri-build reads the configs, capabilities, icons and Windows
# installer hooks, so a change to any of them keeps the full gate. It embeds the built frontend,
# so its checks build that first.
[[components]]
id = "app"
roots = ["src-tauri/"]
depends_on = ["core", "crew"]
build_inputs = ["src-tauri/build.rs", "src-tauri/icons/", "src-tauri/capabilities/", "src-tauri/windows/", "src-tauri/tauri.conf.json", "src-tauri/tauri.macos.conf.json", "src-tauri/tauri.release.json", "src-tauri/tauri.windows.conf.json"]
checks = ["npm run build", "cargo clippy -p nitely-app -- -D warnings"]

[[components.suites]]
id = "lib"
inputs = ["src-tauri/src/"]
[components.suites.cargo]
manifest = "src-tauri/Cargo.toml"
package = "nitely-app"
target_kind = "lib"

# The Leaderboard service, a leaf crate. Only its tests build on the core and the crew (the
# client's report builder and signer), so a change to either runs them; its lib and binary have no
# tests of their own.
[[components]]
id = "leaderboard"
roots = ["server/leaderboard/"]
depends_on = ["core", "crew"]
checks = ["cargo clippy -p nitely-leaderboard -- -D warnings"]

[[components.suites]]
id = "service"
inputs = ["server/leaderboard/"]
[components.suites.cargo]
manifest = "server/leaderboard/Cargo.toml"
package = "nitely-leaderboard"
target_kind = "test"
target = "service"
