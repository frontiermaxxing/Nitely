# Which tests a change can affect (docs/affected-tests.md, NIT-483). Human-approved policy: a
# changed file no component owns, or one this map cannot prove, keeps the full gate. Editing this
# file is itself a Full change.
version = 1
# The repo's rule tests run with every reduced selection, whatever changed (NIT-648): they read the
# whole tree, so no change reaches them through its own files. NIT-644 landed red without them.
always = ["core/repo-rules"]

# The frontend and the repo's scripts: `npm test` runs every src/ test and scripts/*.test.mjs, and
# `npm run build` type-checks and bundles. Whole-suite mapping (inputs), since vite and tsconfig
# resolve imports in ways the static graph does not claim. No Rust code reads these paths. Its
# tests are found by pattern (NIT-505), so a new test file there needs no edit here. Two of the
# core's files are inputs too: src/ui/lifecycle.test.ts reads track_cases.json, which track.rs
# also runs, and scripts/test-sweep.test.mjs imports the sweep's node test (NIT-583 review).
[[components]]
id = "web"
roots = ["src/", "scripts/", "public/", "vite.config.ts", "index.html", "phone.html"]
checks = ["npm run build"]

[[components.suites]]
id = "npm-test"
inputs = ["src/", "scripts/", "public/", "vite.config.ts", "index.html", "phone.html", "crates/nitely-core/src/track_cases.json", "crates/nitely-core/src/test_sweep.cjs", "crates/nitely-core/src/test_sweep.test.cjs"]
[components.suites.javascript]
command = "npm test"
test_patterns = ["scripts/*.test.mjs", "src/**/*.test.ts"]

# The core (NIT-581): every crate builds on it, so a change to it runs its own tests and clippy
# and every suite of crew, cli, app and the leaderboard (their depends_on), but not the
# whole-workspace fallback. Its build script lists migrations/, so a schema change keeps the full
# gate, as does anything it reads from outside its folder (include_str! of .github/, .nitely/ and
# docs/ files, which no component owns). The test-sweep script it embeds (include_str!) is part of
# it, with its own node test; its paths name "test", so verification keeps a change to it on Full.
# The examples are built by `cargo test --workspace`, so a change to core checks they still build.
[[components]]
id = "core"
roots = ["crates/nitely-core/"]
build_inputs = ["crates/nitely-core/build.rs", "crates/nitely-core/migrations/"]
checks = ["cargo clippy -p nitely-core -- -D warnings", "cargo check -p nitely-core --examples", "node --check crates/nitely-core/src/test_sweep.cjs"]

[[components.suites]]
id = "lib"
inputs = ["crates/nitely-core/src/", "crates/nitely-core/examples/"]
[components.suites.cargo]
manifest = "crates/nitely-core/Cargo.toml"
package = "nitely-core"
target_kind = "lib"

# The rule tests (named repo_rule_*): git only through run_git and scratch paths through
# unique_temp, the keychain opened only by entry, and this map in step with the tree.
[[components.suites]]
id = "repo-rules"
inputs = ["crates/nitely-core/src/paths.rs", "crates/nitely-core/src/approval.rs", "crates/nitely-core/src/affected_tests.rs"]
[components.suites.cargo]
manifest = "crates/nitely-core/Cargo.toml"
package = "nitely-core"
target_kind = "lib"
filter = "repo_rule"
test_ids = ["paths::tests::repo_rule_scratch_paths_and_git_runs_go_through_the_shared_helpers", "approval::tests::repo_rule_only_entry_opens_the_keychain", "affected_tests::tests::decided::repo_rule_the_repos_own_map_decides_in_memory"]

[[components.suites]]
id = "node-test"
inputs = ["crates/nitely-core/src/test_sweep.cjs", "crates/nitely-core/src/test_sweep.test.cjs"]
[components.suites.javascript]
command = "node --test crates/nitely-core/src/test_sweep.test.cjs"
test_files = ["crates/nitely-core/src/test_sweep.test.cjs"]

# The crew and the reports on top of the core (NIT-497): nitely-core does not build on it, so a
# change only to it runs its own tests and clippy and the crates above it, not nitely-core's.
[[components]]
id = "crew"
roots = ["crates/nitely-crew/"]
depends_on = ["core"]
checks = ["cargo clippy -p nitely-crew -- -D warnings"]

[[components.suites]]
id = "lib"
inputs = ["crates/nitely-crew/"]
[components.suites.cargo]
manifest = "crates/nitely-crew/Cargo.toml"
package = "nitely-crew"
target_kind = "lib"

# The CLI, a leaf crate: nothing else builds on it, so a change only to it runs its own tests and
# clippy, not nitely-core's. Its build script reads only git's refs (the commit stamp), outside the
# tree; a change to the script keeps the full gate (NIT-484).
[[components]]
id = "cli"
roots = ["crates/nitely-cli/"]
depends_on = ["core", "crew"]
build_inputs = ["crates/nitely-cli/build.rs"]
checks = ["cargo clippy -p nitely-cli -- -D warnings"]

[[components.suites]]
id = "bin"
inputs = ["crates/nitely-cli/"]
[components.suites.cargo]
manifest = "crates/nitely-cli/Cargo.toml"
package = "nitely-cli"
target_kind = "bin"
target = "nitely"

[[components.suites]]
id = "async_submit"
inputs = ["crates/nitely-cli/"]
[components.suites.cargo]
manifest = "crates/nitely-cli/Cargo.toml"
