# The test suite's time budget (goal 20, NIT-522). Every gate reads each test's time from what
# cargo test and node:test print, shows the slowest, and flags a gate that breaks this budget.
# docs/testing.md has the baseline and how the times are taken.

# Seconds any one test may take, unless it is a named scenario below.
test_seconds = 2

# Seconds a whole test binary may take, by the name cargo prints for it (`node` for node:test),
# in a warm lane.
[suites]
nitely_core = 60

# Tests allowed past test_seconds: the end-to-end scenarios each feature keeps (one or two per
# feature), by the name the runner prints, each with what it proves. NIT-523 names them.
[scenarios]
# Lanes, machine admission and executors (NIT-533).
"lanes::tests::a_lane_runs_requests_keeping_only_its_build_dirs" = "the lane round trip: snapshot in, command run, only the build directories kept"
"lanes::tests::a_request_runs_in_the_main_checkout_and_puts_it_back_on_its_branch" = "large-repo mode: the person's checkout lent to a request and given back on its branch"
"lanes::tests::a_snapshot_is_head_or_a_commit_of_the_worktree_without_touching_it" = "a snapshot is HEAD or a commit of the worktree, which it never touches"
"lanes::tests::a_lane_command_takes_what_it_started_with_it" = "process containment: what a lane command started ends with it"
"executor::tests::receiver_reconstructs_binary_snapshot_runs_once_and_refuses_cross_project" = "the executor receiver: a binary patch rebuilt, run once per id, other projects refused"
"machine_transport_runs_snapshot_and_records_executor_without_local_lane" = "the CLI machine transport end to end: nitely run through a relay to nitely executor receive"
# The long tail (NIT-537).
"release_verification::tests::stamped_candidate_full_gate_and_whole_release_review_ignore_pr_switch" = "a stamped release candidate's Full gate and whole-release review, against the last v* tag"
"release_verification::tests::stable_baseline_keeps_earlier_beta_changes_in_the_release_review" = "git's describe picks the stable baseline with exclude_tags (prepare only)"
"submodules::tests::a_lane_has_the_submodule_at_its_snapshot_and_keeps_its_build_output" = "a lane's submodule follows the snapshot's pointer and keeps its build folders"
"submodules::tests::a_submodule_change_keeps_its_patch_when_the_lines_around_it_change" = "git's -U0 --submodule=diff patch id for a submodule change"
"playbook::tests::starts_a_worktree_and_runs_the_gate" = "start_task's worktree and setup, and run_gate with its setup refresh"
"git::tests::worktree_state_from_the_branch_line_matches_asking_git" = "the two ways of reading a worktree's state agree"
"private_terms::tests::finds_added_lines_paths_and_messages" = "what counts as added: lines, paths and commit messages"
"overlap::tests::next_task_reads_held_files_from_branches_and_says_why" = "the only test of the held-files reads"
# Land, the land queue, submit, review and selection (NIT-524 to 526, 538, 539; NIT-528 merged
# the tests the pure functions covered into these).
"land_queue::tests::what_waits_lands_together_on_one_gate_and_what_cannot_goes_back" = "a queue run: stacking, one gate, a conflict sent back untouched, verification records and after-steps once"
"land_queue::tests::a_bad_change_is_bisected_out_of_three" = "bisection on real gates, both halving outcomes"
"land::tests::lands_reviewed_work_and_waits_for_human_approval" = "a single land: push, teardown, cleanup, after-steps; a human wait; auto land in submit and on approval"
"land::tests::a_change_that_spans_a_submodule_lands_both_branches_together" = "a change spanning a submodule: a refused fast-forward puts both back, then both land"
"submit::tests::submits_with_a_review_and_routes_flags_to_a_human" = "submit with a real reviewer, a flag routed to a person, a push"
"submit::tests::basic_submission_and_land_run_only_basic_checks_and_enqueue_an_audit" = "reduced checks, land and the audit they enqueue"
"submit::tests::a_p1_that_two_rounds_leave_open_goes_to_a_person" = "review rounds that stall go to a person (sleeps until NIT-544)"
"submit_job::tests::a_submit_hands_in_at_once_and_the_job_brings_the_result_back" = "async submit: enqueue, supersede, run, deliver"
"affected_tests::tests::reverse_imports_select_helpers_and_tests_but_execute_whole_suite" = "the selector against real git: commit ids, tree, policy blob"
"goal_branch::tests::items_land_into_the_goal_branch_and_a_checkpoint_lands_the_slice_on_main" = "goal branch items and their checkpoint"
"periodic_review::tests::periodic_scenario_threshold_failure_retry_reopen_and_duplicate_finding" = "periodic review end to end"
"periodic_review::tests::periodic_durable_completion_preserves_new_landings_and_replays_card_actions_once" = "periodic review's crash and replay"
"verification_backstop::tests::a_head_known_broken_is_not_run_again_and_the_next_landing_is_checked_at_once" = "the post-merge backstop end to end"
"slim::tests::reclaims_only_finished_worktrees_and_says_why_it_keeps_the_rest" = "slim against real worktrees"
"light::tests::a_light_worktree_runs_no_setup_and_gets_a_reference_tree_its_gate_sets_up_once" = "a light worktree and its reference tree"
"a_long_call_holds_up_none_after_it_and_ends_at_the_cap" = "MCP calls in parallel, the wait cap, and a call finishing after the client leaves"
"a_call_that_meets_a_newer_database_waits_for_the_install_and_goes_to_the_new_build" = "an older build, call and submit job, hands over to the newly installed one"
