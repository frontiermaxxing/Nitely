[package]
name = "nitely-leaderboard"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "The Leaderboard service: takes signed weekly reports, keeps them in SQLite, serves the board."

# Deliberately small: it builds on a plain Linux host without the app's dependencies.
[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
rusqlite.workspace = true
ed25519-dalek = "2"
sha2 = "0.10"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# The share card (NIT-632): glyph outlines from an embedded Geist and a plain PNG, no browser.
ab_glyph = "0.2"
png = "0.17"

[dev-dependencies]
# The client's own report builder and signer, so the tests prove the two sides agree.
nitely-core.workspace = true
nitely-crew.workspace = true
ureq = { version = "3", features = ["json"] }
